<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>storydesignwizzard</title>
  </head>
  <body>
    <div id="root"></div>

    <script src="http://localhost:8081/static/data/javascript/library/external/jQuery/3.4.1/jquery.js"></script>
    <script src="http://localhost:8081/static/data/javascript/library/external/Underscore/1.9.1/underscore.js"></script>
    <script src="http://localhost:8081/static/data/javascript/library/external/Backbone/1.3.3/backbone.js"></script>
    <script src="http://localhost:8081/static/data/javascript/library/external/log4javascript/1.0.0/log4javascript.js"></script>

    <!--
    <script src="http://localhost:8081/static/data/javascript/library/internal/core/nosliw.js"></script>
    <script src="http://localhost:8081/static/data/javascript/library/internal/runtimebrowserinit/utility.js"></script>
    <script src="http://localhost:8081/static/data/javascript/library/internal/runtimebrowserinit/init.js"></script>
    -->

    <script>


var requestStaticInfos = [];
requestStaticInfos.push({
	"type" : "configure",
	"name" : "story"
});

var staticInfos = {"staticInfo" : requestStaticInfos};

var configureData = {};

$.ajax({
	url : "http://localhost:8081/nosliw/static/fetch",
	type : "POST",
	dataType: "json",
	data : JSON.stringify(staticInfos),
	async : true,
	success : function(serviceData, status){
		var result = serviceData.data.item;
		
		var fileNumber = result.length;
		var count = 0;
		
		var processItemInOrder = function(){
			var item = result[count];
			
			if(item.type=="file"){
               //for file
				var scriptEle = document.createElement('script');
				scriptEle.setAttribute('src', item.uri);
				scriptEle.setAttribute('defer', "defer");
				scriptEle.setAttribute('type', 'text/javascript');

				scriptEle.onload = callBack;
				document.getElementsByTagName("head")[0].appendChild(scriptEle);
			}
			else if(item.type=="data"){
				configureData = _.extend(configureData, item.data);
				count++;
				if(count>=fileNumber){
					finishProcessItems();
				}
				else{
    				processItemInOrder();
                }
			}
			
		};
		
		var finishProcessItems = function(){
			configureData = _.extend(configureData, {
			});
			nosliw.init(configureData);
        };
		
		var callBack = function(){
			count++;
			if(count>=fileNumber){
				finishProcessItems();
			}
			else{
				processItemInOrder();
			}
		};
		
		processItemInOrder();
	},
	error: function(obj, textStatus, errorThrown){
	},
});


    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
