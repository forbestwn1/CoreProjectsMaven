 <input type="radio" id="variableMode" name="choiceMode" value="variableMode" checked>

variableMode<br>

<script>

var node_CONSTANT;
var node_COMMONCONSTANT;
var node_COMMONATRIBUTECONSTANT;

var node_basicUtility;
var node_namingConvensionUtility;
var node_createServiceRequestInfoSequence;
var node_requestServiceProcessor;
var node_ResourceId;
var node_createStateBackupService;
var node_createRuntimeEnvironment;
var node_BrickId;
var node_createRuntimeEnv;


var currentMode;

var constantModeApp;
var variableModeApp;
var dataType;

//when nosliw active
$(document).on("nosliwActive", function(){
	node_CONSTANT = nosliw.getNodeData("constant.CONSTANT");
	node_COMMONCONSTANT = nosliw.getNodeData("constant.COMMONCONSTANT");
	node_COMMONATRIBUTECONSTANT = nosliw.getNodeData("constant.COMMONATRIBUTECONSTANT");
	
	node_basicUtility = nosliw.getNodeData("common.utility.basicUtility");
	node_namingConvensionUtility = nosliw.getNodeData("common.namingconvension.namingConvensionUtility");
	node_createServiceRequestInfoSequence = nosliw.getNodeData("request.request.createServiceRequestInfoSequence");
	node_requestServiceProcessor = nosliw.getNodeData("request.requestServiceProcessor");
	node_ResourceId = nosliw.getNodeData("resource.entity.ResourceId");
	node_createStateBackupService = nosliw.getNodeData("component.createStateBackupService");
	node_createRuntimeEnvironment = nosliw.getNodeData("complexentity.entity.createRuntimeEnvironment");
	node_BrickId = nosliw.getNodeData("complexentity.entity.BrickId");
	node_createRuntimeEnv = nosliw.getNodeData("framework7.createRuntimeEnv");

	var parms = node_basicUtility.getParmsInUrl();
	dataType = parms.dataType==undefined?"string":parms.dataType;

	if(dataType=="date"){
		$("#chooseMode").show();    
		updateModeSelection("constantMode");
	}
	else{
		$("#variableMode").hide();    
		updateModeSelection("constantMode");
	}

	$('input[name="choiceMode"]').change(function() {
	    if ($('#variableMode').is(':checked')) {
	    	updateModeSelection("variableMode");
	    } else {
	    	updateModeSelection("constantMode");
	    }
	});
	
});

var createConstantOperand = function(){
};
var createVariableOperand = function(){
};
var createOperationOperand = function(){
};


var updateModeSelection = function(mode){
	currentMode = mode;

    if (currentMode=="variableMode") {
          $('#variableModeArea').show(); // jQuery shorthand to display the block
          $('#constantModeArea').hide(); // jQuery shorthand to hide the block completely
    } else {
	      $('#variableModeArea').hide(); // jQuery shorthand to display the block
	      $('#constantModeArea').show(); // jQuery shorthand to hide the block completely
	      if(constantModeApp==undefined){
	    	  createDataConstantChooseStandAlone(dataType, function(application){
	    		  constantModeApp = application;
				  $("#constantModeArea").append(application.getView());
	    	  });
	      }
    }
};

var createDataConstantChooseStandAlone = function(dataType, callBackFun){
	var request = node_createServiceRequestInfoSequence();
	var gatewayParm = {};

	var datadefinition = {
            "type" : "writable",   
			"criteria" : "test." + dataType + ";1.0.0"
    };
	var uiTagQueryForChange = {};
	uiTagQueryForChange[node_COMMONATRIBUTECONSTANT.UITAGEQUERYDATA_DATADEFINITION] = datadefinition;
	uiTagQueryForChange[node_COMMONATRIBUTECONSTANT.UITAGEQUERYDATA_IOMODE] = node_COMMONCONSTANT.IO_DIRECTION_IN;

    var parm1 = {};
	parm1[node_COMMONATRIBUTECONSTANT.STORYMANAGERSTANDALONE_CEATESTANDALONE_PARM_UITAGQUERY] = uiTagQueryForChange;
	var providerRequest1 = {};
	providerRequest1[node_COMMONATRIBUTECONSTANT.MANUALSTANDALONEPROVIDERREQUEST_PARMS] = parm1;
	var item1 = {};
	item1[node_COMMONATRIBUTECONSTANT.MANUALSTANDALONEREQUEST_PROVIDERNAME] = node_COMMONCONSTANT.STANDALONE_PROVIDER_STORY;
    item1[node_COMMONATRIBUTECONSTANT.MANUALSTANDALONEREQUEST_PROVIDERREQUEST] = providerRequest1;

	var items = [];
	items.push(item1);

	var requestObj = {};
	requestObj[node_COMMONATRIBUTECONSTANT.MANUALSTANDALONESBUILDREQUEST_ITEM] = items;

	gatewayParm[node_COMMONATRIBUTECONSTANT.MANUALGATEWAYSTANDALONE_PARMS_REQUEST] = requestObj;


		request.addRequest(nosliw.runtime.getGatewayService().getExecuteGatewayCommandRequest(
			node_COMMONCONSTANT.GATEWAY_MANUAL_STANDALONE,
			node_COMMONATRIBUTECONSTANT.MANUALGATEWAYSTANDALONE_COMMAND_BUILD,
			gatewayParm,
			{
				success: function (requestInfo, resourceIds) {
					var bundleDef = nosliw.runtime.getResourceService().getResource(new node_ResourceId(resourceIds[0])).resourceData[node_COMMONATRIBUTECONSTANT.RESOURCEDATAIMPTRANSIENT_VALUE];

					var out = node_createServiceRequestInfoSequence({});
					out.addRequest(nosliw.runtime.getComplexEntityService().getCreateApplicationRequest({ bundleDef: bundleDef }, undefined, {}, undefined, {
						success: function (requestInfo, application) {
							callBackFun(application);
							return application;
						}
					}));
					return out;
				}
			}
		));
		node_requestServiceProcessor.processRequest(request);			
};



var requestStaticInfos = [];
requestStaticInfos.push({
	"type" : "configure",
	"name" : "core"
});

var staticInfos = {"staticInfo" : requestStaticInfos};

var configureData = {};

$.ajax({
	url : "http://localhost:8081/nosliw/static/fetch",
	type : "POST",
	dataType: "json",
	data : JSON.stringify(staticInfos),
	async : true,
	success : function(serviceData, status){
		var result = serviceData.data.item;
		
		var fileNumber = result.length;
		var count = 0;
		
		var processItemInOrder = function(){
			var item = result[count];
			
			if(item.type=="file"){
               //for file
				var scriptEle = document.createElement('script');
				scriptEle.setAttribute('src', item.uri);
				scriptEle.setAttribute('defer', "defer");
				scriptEle.setAttribute('type', 'text/javascript');

				scriptEle.onload = callBack;
				document.getElementsByTagName("head")[0].appendChild(scriptEle);
			}
			else if(item.type=="data"){
				configureData = _.extend(configureData, item.data);
				count++;
				if(count>=fileNumber){
					finishProcessItems();
				}
				else{
    				processItemInOrder();
                }
			}
			
		};
		
		var finishProcessItems = function(){
			configureData = _.extend(configureData, {
				logging : {
					module : ["process", "requestInfo", "requestManager"]
				}
			});
			nosliw.init(configureData);
        };
		
		var callBack = function(){
			count++;
			if(count>=fileNumber){
				finishProcessItems();
			}
			else{
				processItemInOrder();
			}
		};
		
		processItemInOrder();
	},
	error: function(obj, textStatus, errorThrown){
	},
});

</script>

</html>
