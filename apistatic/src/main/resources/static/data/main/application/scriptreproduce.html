$(document).on("nosliwActive", function(){
	
	var node_basicUtility = nosliw.getNodeData("common.utility.basicUtility");
	var parms = node_basicUtility.getParmsInUrl();

	var requestStaticInfos = [];
	requestStaticInfos.push({
		"type" : "folder",
		"folder" : "scriptexport/scripts/"+parms.name
	});

	fectchUtility({"staticInfo" : requestStaticInfos}, 
			function(data){
	        }, 
			function(uri){

			});

});

var parms = {};
var searchParams = new URLSearchParams(window.location.search).entries();
var next = searchParams.next();
while(!next.done){
	var p = next.value;
	parms[p[0]] = p[1];
	next = searchParams.next();
}


var requestStaticInfos = [];
requestStaticInfos.push({
	"type" : "configure",
	"name" : "scriptreproduce"
});

var staticInfos = {"staticInfo" : requestStaticInfos};

var configureData = {};

fectchUtility(staticInfos, 
		function(data){
        	configureData = _.extend(configureData, data);
        }, 
		function(uri){

        }, 
		function(){
			configureData = _.extend(configureData, {
				logging : {
					module : ["process", "requestInfo", "requestManager"]
				}
			});
			nosliw.init(configureData);
        });


</script>
