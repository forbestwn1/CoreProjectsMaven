    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e7e9ec;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }

        /* 1. Title Section */
        .title-section {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 3px solid #59636e;
        }

        .title-section h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .title-section p {
            color: #666;
            font-size: 1.1em;
        }

        /* 2. Input Section */
        .input-section {
            margin-bottom: 40px;
        }

        .input-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 15px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .input-group input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #59636e;
            box-shadow: 0 0 5px rgba(89, 99, 110, 0.3);
        }

        /* 3. Submit Button */
        .button-section {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: #4b5560;
            color: white;
            min-width: 150px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(75, 85, 96, 0.3);
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
            min-width: 100px;
            border: 2px solid #ddd;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        /* 4. Result Section */
        .result-section {
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #59636e;
            padding-bottom: 10px;
        }

        .result-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .result-item {
            background: #f9f9f9;
            border-left: 4px solid #59636e;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .result-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
            user-select: none;
        }

        .result-item-title {
            font-weight: 700;
            color: #4b5560;
            font-size: 1.1em;
        }

        .result-item-toggle {
            color: #999;
            font-size: 1.5em;
            transition: transform 0.3s ease;
        }

        .result-item.expanded .result-item-toggle {
            transform: rotate(180deg);
        }

        .result-item-content {
            display: none;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .result-item.expanded .result-item-content {
            display: block;
        }

        .result-subitem {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 15px;
            margin-bottom: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .result-subitem:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .result-label {
            font-weight: 600;
            color: #555;
        }

        .result-value {
            color: #333;
            word-break: break-word;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 30px 0;
            font-size: 1.1em;
        }
    </style>

<script>

var fetchTasks = [];
fetchTasks.push(createCoreStaticTask());

var fetchTasks = [
 	createCoreStaticTask(),
	createFetchTask(
	    {
		    "staticInfo" : [
			    {
				    "type" : "configure",
				    "name" : "production"
	            }
		    ],
		    "requestId" : "ProductionMode"
	    },
	    function(data){
             nosliw.setConfigure(data);
        }
	),
];

createStaticFetchTaskManager().fetch(fetchTasks, function(){

	var node_CONSTANT = nosliw.getNodeData("constant.CONSTANT");
	var node_COMMONCONSTANT = nosliw.getNodeData("constant.COMMONCONSTANT");
	var node_COMMONATRIBUTECONSTANT = nosliw.getNodeData("constant.COMMONATRIBUTECONSTANT");
	
	var node_basicUtility = nosliw.getNodeData("common.utility.basicUtility");
	var node_namingConvensionUtility = nosliw.getNodeData("common.namingconvension.namingConvensionUtility");
	var node_createServiceRequestInfoSequence = nosliw.getNodeData("request.request.createServiceRequestInfoSequence");
	var node_requestServiceProcessor = nosliw.getNodeData("request.requestServiceProcessor");
	var node_ResourceId = nosliw.getNodeData("resource.entity.ResourceId");
	var node_createStateBackupService = nosliw.getNodeData("component.createStateBackupService");
	var node_createRuntimeEnvironment = nosliw.getNodeData("complexentity.entity.createRuntimeEnvironment");
	var node_BrickId = nosliw.getNodeData("complexentity.entity.BrickId");
	var node_createRuntimeEnv = nosliw.getNodeData("framework7.createRuntimeEnv");
	
	var parms = node_basicUtility.getParmsInUrl();
	var resourceType = parms.resourceType==undefined?undefined : node_namingConvensionUtility.cascadeLevel1(parms.resourceType, "1.0.0");
	var resourceId = resourceType==null? null : new node_ResourceId(parms.resourceId, resourceType);

	var brickType = parms.brickType==undefined?undefined : node_namingConvensionUtility.cascadeLevel1(parms.brickType, "1.0.0");
	var brickId = brickType==null? null : new node_BrickId(parms.brickId, parms.division, brickType);
	
	var configure = parms.configure;
		
    var runtimeEnv = node_createRuntimeEnv($("#moduleDiv").get());
	nosliw.runtime.runtimeEnv = node_createRuntimeEnvironment(undefined, runtimeEnv.getValues()); 
	
	var runtimeContext = {
		view : runtimeEnv.getView(),
//		backupState : node_createStateBackupService(resourceId[node_COMMONATRIBUTECONSTANT.RESOURCEID_RESOURCETYPE], resourceId[[node_COMMONATRIBUTECONSTANT.RESOURCEID_ID]], "1.0.0", nosliw.runtime.getStoreService()),
	};

	var out = node_createServiceRequestInfoSequence(undefined);
	
	out.addRequest(nosliw.runtime.getComplexEntityService().getCreateApplicationRequest({brickId:brickId, resourceId:resourceId}, configure==""?undefined:configure, runtimeContext, undefined, {
		success : function(request, application){
           application.registerExposeEventListener(undefined, function(eventName, eventValue, request){
         		console.log(JSON.stringify(eventName));
         		console.log(JSON.stringify(eventValue));
           }, application);
			
			
           $("#command").on("click", function(event) {
        	    event.preventDefault(); // Stop the default page navigation
        	    application.executeExecuteCommandRequest("setData", {
                    "data" : {
    					dataTypeId: "test.string;1.0.0",
	                	value: "value from command"
	                }
        	    });
        	});
           
			var event = new CustomEvent("nosliwApplicationActive", {
				bubbles: true,
				detail: application
			});
		    window.dispatchEvent(event);
			return application;
		}
	}));
	node_requestServiceProcessor.processRequest(out);
});

</script>
