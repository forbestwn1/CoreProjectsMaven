# Docker-specific configuration
# This profile is activated when SPRING_PROFILES_ACTIVE=docker

spring.main.allow-circular-references=true

# Database Configuration (for services that use it)
spring.datasource.url=jdbc:mysql://mysql:3306/nosliw
spring.datasource.username=nosliw
spring.datasource.password=nosliwpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Internal service communication (container-to-container)
datasource.data_source_url=http://apidatasource:8083/nosliw/datasource/

# File paths - adjusted for Docker environment
division.manual.source_path=file:///app/data/manual/src
division.manual.path=file:///app/data/manual/export
division.story.path=file:///app/data/story

uitag.path=file:///app/data/uitag
codetable.path=file:///app/data/codetable
script.path=file:///app/data/scripts
configure.path=file:///app/data/configure
taskinterface.path=file:///app/data/serviceinterface

rhino.script_export_path=file:///app/data/script-export
bundle.export_path=file:///app/data/bundle-export

# Application directory
application.directory.temp=/app/data/temp

# Server configuration
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024

# Logging configuration
logging.level.root=INFO
logging.level.com.nosliw=DEBUG

# Actuator for health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
